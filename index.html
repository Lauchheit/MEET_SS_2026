<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f5f0;
      color: #1a1814;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e2da;
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: #1a5c3a;
    }
    .logo span { color: #1a1814; }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 28px 60px;
    }

    #search-wrapper {
      background: #fff;
      border: 1px solid #e5e2da;
      border-radius: 8px;
      padding: 20px;
    }

    .source-icon {
      font-size: 0.85rem;
      margin-bottom: 3px;
      display: block;
      line-height: 1;
    }

    /* Legend */
    .legend {
      margin-top: 32px;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid #e5e2da;
      border-radius: 8px;
    }

    .legend-title {
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888;
      margin-bottom: 10px;
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
    }

    .legend-item {
      font-size: 0.8rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>

  <script async src="https://cse.google.com/cse.js?cx=059eb1c8bf67040e8"></script>
</head>
<body>

<header>
  <div class="logo">Med<span>Search</span></div>
</header>

<main>
    <div class="legend">
    <div class="legend-title">Source types</div>
    <div class="legend-items">
      <div class="legend-item">🏛 Government agency</div>
      <div class="legend-item">🤝 Non-profit</div>
      <div class="legend-item">🎓 University</div>
      <div class="legend-item">🏢 Commercial</div>
    </div>
  </div>
  <div id="search-wrapper">
    <div class="gcse-search"></div>
  </div>

  
</main>

<script>
  const SOURCES = [
    { match: "nih.gov",                type: "gov", icon: "🏛" },
    { match: "cdc.gov",                type: "gov", icon: "🏛" },
    { match: "medlineplus.gov",        type: "gov", icon: "🏛" },
    { match: "nhs.uk",                 type: "gov", icon: "🏛" },
    { match: "mayoclinic.org",         type: "npo", icon: "🤝" },
    { match: "my.clevelandclinic.org", type: "npo", icon: "🤝" },
    { match: "rarediseases.org",       type: "npo", icon: "🤝" },
    { match: "health.harvard.edu",     type: "uni", icon: "🎓" },
    { match: "hopkinsmedicine.org",    type: "uni", icon: "🎓" },
    { match: "merckmanuals.com",       type: "com", icon: "🏢" },
    { match: "webmd.com",              type: "com", icon: "🏢" },
    { match: "healthline.com",         type: "com", icon: "🏢" },
  ];

  function getSource(url) {
    return SOURCES.find(s => url.includes(s.match)) || null;
  }

  function injectBadges() {
    document.querySelectorAll(".gsc-result").forEach(result => {
      if (result.dataset.badged) return;

      const linkEl = result.querySelector("a.gs-title");
      if (!linkEl) return;

      const url = linkEl.getAttribute("data-cturl") || linkEl.href || "";
      const source = getSource(url);
      if (!source) return;

      result.dataset.badged = "1";

      const icon = document.createElement("span");
      icon.className = "source-icon";
      icon.textContent = source.icon;
      linkEl.parentNode.insertBefore(icon, linkEl);
    });
  }

  new MutationObserver(injectBadges)
    .observe(document.body, { childList: true, subtree: true });
</script>

</body>
</html>
